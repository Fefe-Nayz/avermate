version: 1
profile: node-byok
bind: { host: 127.0.0.1, port: 5188 }
dataDir: /data/node
storage:
  driver: filesystem
  filesystemRoot: /data/node/objects
  maxObjectBytes: 536870912
  quotaBytes: 21474836480
relay: {}
# The configurator adds an exact endpoint, model catalogue and secret reference.
# This checked-in profile remains fail-closed until the operator does so.
models: { enabled: false, providerSecretRefs: [] }
sandbox: { enabled: false, provider: disabled }
telemetry: { enabled: false }
