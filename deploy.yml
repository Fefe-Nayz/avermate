services:
  # Garage 2.3 bootstraps its single-node layout, application key and bucket.
  # GARAGE_ACCESS_KEY_ID must start with GK; GARAGE_SECRET_ACCESS_KEY and
  # GARAGE_RPC_SECRET must be generated secrets (the RPC secret is 64 hex chars).
  garage:
    image: dxflrs/garage:v2.3.0
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    restart: unless-stopped
    environment:
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET}
      - GARAGE_DEFAULT_ACCESS_KEY=${GARAGE_ACCESS_KEY_ID}
      - GARAGE_DEFAULT_SECRET_KEY=${GARAGE_SECRET_ACCESS_KEY}
      - GARAGE_DEFAULT_BUCKET=avermate
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
      - garage-snapshots:/var/lib/garage/snapshots
    expose:
      - 3900
      - 3903
    networks:
      - internal
      - webgateway
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.avermate-s3.rule=Host(`s3.avermate.nayz.fr`)"
      - "traefik.http.services.avermate-s3.loadbalancer.server.port=3900"
      - "traefik.http.routers.avermate-s3.entrypoints=websecure"
      - "traefik.http.routers.avermate-s3.tls.certresolver=myresolver"
      - "traefik.http.routers.avermate-s3.tls=true"

  # Better Upload sends PUTs from the browser, so the bucket needs S3 CORS.
  garage-cors:
    image: amazon/aws-cli:2
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        until aws --endpoint-url http://garage:3900 s3api head-bucket --bucket avermate;
        do sleep 2; done;
        aws --endpoint-url http://garage:3900 s3api put-bucket-cors
        --bucket avermate --cors-configuration file:///garage-cors.json
    environment:
      - AWS_DEFAULT_REGION=garage
      - AWS_ACCESS_KEY_ID=${GARAGE_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${GARAGE_SECRET_ACCESS_KEY}
    volumes:
      - ./infra/garage/cors.json:/garage-cors.json:ro
    depends_on:
      - garage
    networks:
      - internal
    restart: "no"

  # API + oRPC
  api:
    image: ghcr.io/fefe-nayz/avermate-api:latest
    environment:
      # Database
      - DATABASE_URL=
      - DATABASE_AUTH_TOKEN=
      # Better Auth
      - BETTER_AUTH_URL=
      - BETTER_AUTH_SECRET=
      # Required for authenticated SSR when web and API use sibling subdomains.
      - AUTH_COOKIE_DOMAIN=
      - ADMIN_USER_IDS=
      # MCP / OAuth resource server
      - MCP_RESOURCE_URL=
      - MCP_REQUEST_STATE_SECRET=
      - MCP_ALLOWED_HOSTS=
      - MCP_ALLOWED_ORIGINS=
      - MCP_ENABLE_DCR=false
      # Web client
      - CLIENT_URL=
      - PORT=5000
      - NODE_ENV=production
      # OAuth — each provider is skipped unless both values are present
      - MICROSOFT_CLIENT_ID=
      - MICROSOFT_CLIENT_SECRET=
      - ONEDRIVE_CLIENT_ID=
      - ONEDRIVE_CLIENT_SECRET=
      - ONEDRIVE_TENANT_ID=common
      - ONEDRIVE_REDIRECT_URI=
      - ONEDRIVE_WEBHOOK_URL=
      - GOOGLE_CLIENT_ID=
      - GOOGLE_CLIENT_SECRET=
      # Google Drive Materials connector
      - GOOGLE_DRIVE_CLIENT_ID=
      - GOOGLE_DRIVE_CLIENT_SECRET=
      - GOOGLE_DRIVE_REDIRECT_URI=https://api.avermate.nayz.fr/api/connectors/googledrive/callback
      - GOOGLE_DRIVE_WEBHOOK_URL=
      # Email
      - RESEND_API_KEY=
      - EMAIL_FROM=
      # Self-hosted Garage / S3-compatible storage
      - STORAGE_DRIVER=s3
      - S3_ENDPOINT=https://s3.avermate.nayz.fr
      - S3_REGION=garage
      - S3_ACCESS_KEY_ID=${GARAGE_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${GARAGE_SECRET_ACCESS_KEY}
      - S3_BUCKET=avermate
      - S3_PRIVATE_BUCKET=avermate
      # Costly capabilities — users can still override these with BYOK
      - MISTRAL_API_KEY=
      - TRANSCRIPTION_API_KEY=
      - TRANSCRIPTION_PROVIDER=mistral
      - TTS_PROVIDER=mistral
      - TTS_MODEL=voxtral-mini-tts-2603
      - TTS_VOICE_ID=
      - INFERENCE_API_KEY=
      - OCR_MAX_PAGES_PER_DOCUMENT=300
      - TECTONIC_BIN=tectonic
      - TECTONIC_BUNDLE=
      - TECTONIC_CACHE_DIR=/var/cache/avermate/tectonic
      - TECTONIC_ONLY_CACHED=false
      - PDFTOPPM_BIN=pdftoppm
      - PDFINFO_BIN=pdfinfo
      - MAGICK_BIN=magick
      # Explicit degradation switches for self-hosted environments
      - DISABLE_EMAIL=false
      - DISABLE_UPLOADS=false
      - DISABLE_JOBS=false
      - DISABLE_OCR=false
      - DISABLE_TRANSCRIPTION=false
      - DISABLE_TTS=false
    expose:
      - 5000
    volumes:
      - tectonic-cache:/var/cache/avermate/tectonic
    depends_on:
      garage-cors:
        condition: service_completed_successfully
    networks:
      - internal
      - webgateway
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.avermate-api.rule=Host(`api.avermate.nayz.fr`)"
      - "traefik.http.services.avermate-api.loadbalancer.server.port=5000"
      - "traefik.http.routers.avermate-api.entrypoints=websecure"
      - "traefik.http.routers.avermate-api.tls.certresolver=myresolver"
      - "traefik.http.routers.avermate-api.tls=true"

  # Web
  web:
    image: ghcr.io/fefe-nayz/avermate-web:latest
    environment:
      - NEXT_PUBLIC_API_URL=
      - NEXT_PUBLIC_APP_URL=
      # Private API address for Server Components and server prefetching.
      - API_INTERNAL_URL=http://api:5000
    expose:
      - 3000
    networks:
      - internal
      - webgateway
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.avermate-web.rule=Host(`avermate.nayz.fr`)"
      - "traefik.http.services.avermate-web.loadbalancer.server.port=3000"
      - "traefik.http.routers.avermate-web.entrypoints=websecure"
      - "traefik.http.routers.avermate-web.tls.certresolver=myresolver"
      - "traefik.http.routers.avermate-web.tls=true"

networks:
  # Internal network
  internal:
  # Reverse proxy network
  webgateway:
    external: true
    name: webgateway

volumes:
  garage-meta:
  garage-data:
  garage-snapshots:
  tectonic-cache:
