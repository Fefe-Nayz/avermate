services:
  # API + oRPC
  api:
    image: ghcr.io/fefe-nayz/avermate-api:latest
    environment:
      # Database
      - DATABASE_URL=
      - DATABASE_AUTH_TOKEN=
      # Better Auth
      - BETTER_AUTH_URL=
      - BETTER_AUTH_SECRET=
      - ADMIN_USER_IDS=
      # Web client
      - CLIENT_URL=
      - PORT=5000
      - NODE_ENV=production
      # OAuth — each provider is skipped unless both values are present
      - MICROSOFT_CLIENT_ID=
      - MICROSOFT_CLIENT_SECRET=
      - GOOGLE_CLIENT_ID=
      - GOOGLE_CLIENT_SECRET=
      # Email
      - RESEND_API_KEY=
      - EMAIL_FROM=
      # Uploads
      - UPLOADTHING_TOKEN=
      # Feedback relay
      - DISCORD_WEBHOOK_URL=
    expose:
      - 5000
    networks:
      - internal
      - webgateway
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.avermate-api.rule=Host(`api.avermate.nayz.fr`)"
      - "traefik.http.services.avermate-api.loadbalancer.server.port=5000"
      - "traefik.http.routers.avermate-api.entrypoints=websecure"
      - "traefik.http.routers.avermate-api.tls.certresolver=myresolver"
      - "traefik.http.routers.avermate-api.tls=true"

  # Web
  web:
    image: ghcr.io/fefe-nayz/avermate-web:latest
    environment:
      - NEXT_PUBLIC_API_URL=
      - NEXT_PUBLIC_APP_URL=
    expose:
      - 3000
    networks:
      - internal
      - webgateway
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.avermate-web.rule=Host(`avermate.nayz.fr`)"
      - "traefik.http.services.avermate-web.loadbalancer.server.port=3000"
      - "traefik.http.routers.avermate-web.entrypoints=websecure"
      - "traefik.http.routers.avermate-web.tls.certresolver=myresolver"
      - "traefik.http.routers.avermate-web.tls=true"

networks:
  # Internal network
  internal:
  # Reverse proxy network
  webgateway:
    external: true
    name: webgateway
