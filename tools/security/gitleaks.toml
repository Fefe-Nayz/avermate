[extend]
useDefault = true

[allowlist]
description = "Narrow synthetic replay and invitation identifiers used by deterministic tests"
regexTarget = "line"
regexes = [
  '''(?i)\bidempotencyKey\s*:\s*["']?[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}["']?''',
  '''\bconst\s+token\s*=\s*["']abcdefghijklmnopqrstuvwxyz[A-Za-z0-9_-]*["']''',
  '''(?i)["'](?:checksum|sha256)["']\s*:\s*["'][a-f0-9]{64}["']''',
  '''(?i)["']00[0-9]{2}_[a-z0-9_]+["']\s*:\s*["'][a-f0-9]{64}["']''',
]
