name: Verify and deploy

on:
  push:
    branches:
      - "main"
      - "rewrite"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      DATABASE_URL: file:./ci.db
      BETTER_AUTH_URL: http://localhost:5000
      BETTER_AUTH_SECRET: ci-secret-that-is-longer-than-thirty-two-characters
      CLIENT_URL: http://localhost:3000
      API_INTERNAL_URL: http://localhost:5000
      NEXT_PUBLIC_API_URL: http://localhost:5000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      EXPO_PUBLIC_SERVER_URL: http://localhost:5000
      DISABLE_EMAIL: "true"
      DISABLE_UPLOADS: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi

          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse "$GITHUB_SHA^")"
          fi

          mapfile -d '' changed_files < <(
            git diff --name-only --diff-filter=ACMR -z "$base_sha" "$GITHUB_SHA" -- apps/web
          )

          if (( ${#changed_files[@]} == 0 )); then
            echo "No changed web files to format-check."
            exit 0
          fi

          web_files=()
          for file in "${changed_files[@]}"; do
            web_files+=("${file#apps/web/}")
          done

          cd apps/web
          bunx prettier --check "${web_files[@]}"

      - name: Lint
        run: bun run lint

      # anti-slop + the react-doctor correctness/security/a11y slice; the deep
      # React scan runs separately in react-doctor.yml.
      - name: Lint (oxlint)
        run: bun run lint:slop

      - name: Typecheck
        run: bun run check-types

      - name: Verify migrations on a fresh database
        run: bun run db:migrate

      # Covers the core engine, API contracts, MCP, social/privacy invariants,
      # SSR helpers, chart interactions, mobile models, and both catalogues.
      - name: Test
        run: bun run test

      - name: Build production applications
        run: bun run build

      - name: Export the Expo application
        working-directory: apps/mobile
        run: bunx expo export --platform all --output-dir /tmp/avermate-expo-export

  build-push:
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/server/Dockerfile
          push: true
          tags: |
            ghcr.io/fefe-nayz/avermate-api:latest
            ghcr.io/fefe-nayz/avermate-api:${{ github.sha }}

      - name: Build and push the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/fefe-nayz/avermate-web:latest
            ghcr.io/fefe-nayz/avermate-web:${{ github.sha }}
