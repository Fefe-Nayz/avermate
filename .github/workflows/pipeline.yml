name: Deploy

on:
  push:
    branches:
      - "main"
  pull_request:

permissions:
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check-types

      # Covers the averaging engine and the message catalogues: a missing
      # French string would otherwise ship as silent English.
      - name: Test
        run: bun run test

  build-push:
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/server/Dockerfile
          push: true
          tags: |
            ghcr.io/fefe-nayz/avermate-api:latest
            ghcr.io/fefe-nayz/avermate-api:${{ github.sha }}

      - name: Build and push the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/fefe-nayz/avermate-web:latest
            ghcr.io/fefe-nayz/avermate-web:${{ github.sha }}
