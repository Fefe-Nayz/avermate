name: Plan 034 managed shadow gates

on:
  pull_request:
    paths:
      - "apps/server/src/entitlements/**"
      - "apps/server/src/usage/**"
      - "apps/server/src/billing/**"
      - "apps/server/src/managed/**"
      - "apps/server/src/storage/**"
      - "apps/server/src/privacy/**"
      - "apps/server/src/observability/**"
      - "apps/server/src/operations/**"
      - "apps/server/src/node/**"
      - "apps/server/src/sandbox/**"
      - "apps/server/src/ingestion/execution-profiles.ts"
      - "apps/server/scripts/sandbox-conformance*"
      - "apps/server/package.json"
      - "apps/sandbox-worker/**"
      - "apps/server/src/lib/ocr*"
      - "apps/server/src/lib/transcription*"
      - "apps/server/src/lib/text-to-speech*"
      - "apps/server/src/lib/service-keys*"
      - "apps/server/src/lib/provider-key-validation*"
      - "apps/server/drizzle/0060*"
      - "packages/agent-contracts/src/managed*"
      - "packages/agent-contracts/src/media*"
      - "packages/agent-contracts/src/sandbox*"
      - "packages/agent-contracts/src/index.ts"
      - "packages/agent-contracts/package.json"
      - "infra/compose/**"
      - "scripts/verification/plan-032*"
      - "scripts/verification/plan-033*"
      - "scripts/verification/plan-034*"
      - ".github/workflows/plan-034-managed-gates.yml"
      - "package.json"
      - "bun.lock"
  push:
    branches: [main]
    paths:
      - "apps/server/src/entitlements/**"
      - "apps/server/src/usage/**"
      - "apps/server/src/billing/**"
      - "apps/server/src/managed/**"
      - "apps/server/src/storage/**"
      - "apps/server/src/privacy/**"
      - "apps/server/src/observability/**"
      - "apps/server/src/operations/**"
      - "apps/server/src/node/**"
      - "apps/server/src/sandbox/**"
      - "apps/server/src/ingestion/execution-profiles.ts"
      - "apps/server/scripts/sandbox-conformance*"
      - "apps/server/package.json"
      - "apps/sandbox-worker/**"
      - "apps/server/src/lib/ocr*"
      - "apps/server/src/lib/transcription*"
      - "apps/server/src/lib/text-to-speech*"
      - "apps/server/src/lib/service-keys*"
      - "apps/server/src/lib/provider-key-validation*"
      - "apps/server/drizzle/0060*"
      - "packages/agent-contracts/src/managed*"
      - "packages/agent-contracts/src/media*"
      - "packages/agent-contracts/src/sandbox*"
      - "packages/agent-contracts/src/index.ts"
      - "packages/agent-contracts/package.json"
      - "infra/compose/**"
      - "scripts/verification/plan-032*"
      - "scripts/verification/plan-033*"
      - "scripts/verification/plan-034*"
      - ".github/workflows/plan-034-managed-gates.yml"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plan-034-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  DATABASE_URL: file:./plan-034-ci.db
  BETTER_AUTH_URL: http://localhost:5000
  BETTER_AUTH_SECRET: plan-034-ci-secret-longer-than-thirty-two-characters
  CLIENT_URL: http://localhost:3000
  API_INTERNAL_URL: http://localhost:5000
  NEXT_PUBLIC_API_URL: http://localhost:5000
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  DISABLE_EMAIL: "true"
  DISABLE_UPLOADS: "true"
  DISABLE_JOBS: "true"
  AVERMATE_DEPLOYMENT_MODE: full-self-host
  MANAGED_ACCOUNTING_MODE: shadow
  MANAGED_ADAPTERS_ENABLED: "false"

jobs:
  shadow-proof:
    name: Repository shadow accounting, isolation and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Validate pinned Compose service images
        run: docker compose -f infra/compose/avermate.yml --profile full-self-host config --quiet

      - name: Run provider-neutral Plan 034 shadow gates
        shell: bash
        run: |
          set +e
          set -o pipefail
          bun run verify:034:shadow 2>&1 | tee plan-034-shadow-summary.log
          gate_status=${PIPESTATUS[0]}
          {
            echo "## Plan 034 repository shadow verification"
            echo
            echo '```text'
            tail -n 250 plan-034-shadow-summary.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$gate_status"

  live-isolation-proof:
    name: Required live managed isolation attestation (push/manual)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SANDBOX_PROVIDER: ${{ vars.SANDBOX_PROVIDER }}
      SANDBOX_HOST_POLICY_DIGEST: ${{ vars.SANDBOX_HOST_POLICY_DIGEST }}
      SANDBOX_EVIDENCE_MAX_AGE_MS: "300000"
      SANDBOX_PROFILE_BROWSER_ENABLED: "true"
      SANDBOX_PROFILE_BROWSER_VERSION: ${{ vars.SANDBOX_PROFILE_BROWSER_VERSION }}
      SANDBOX_PROFILE_BROWSER_IMAGE_DIGEST: ${{ vars.SANDBOX_PROFILE_BROWSER_IMAGE_DIGEST }}
      SANDBOX_PROFILE_BROWSER_IMAGE_URI: ${{ vars.SANDBOX_PROFILE_BROWSER_IMAGE_URI }}
      SANDBOX_PROFILE_MEDIA_ENABLED: "true"
      SANDBOX_PROFILE_MEDIA_VERSION: ${{ vars.SANDBOX_PROFILE_MEDIA_VERSION }}
      SANDBOX_PROFILE_MEDIA_IMAGE_DIGEST: ${{ vars.SANDBOX_PROFILE_MEDIA_IMAGE_DIGEST }}
      SANDBOX_PROFILE_MEDIA_IMAGE_URI: ${{ vars.SANDBOX_PROFILE_MEDIA_IMAGE_URI }}
      SANDBOX_OPENSANDBOX_DOMAIN: ${{ vars.SANDBOX_OPENSANDBOX_DOMAIN }}
      SANDBOX_OPENSANDBOX_EVIDENCE_URL: ${{ vars.SANDBOX_OPENSANDBOX_EVIDENCE_URL }}
      SANDBOX_OPENSANDBOX_PROTOCOL: ${{ vars.SANDBOX_OPENSANDBOX_PROTOCOL }}
      SANDBOX_OPENSANDBOX_ISOLATION: kata-multitenant
      SANDBOX_MULTI_TENANT: "true"
      SANDBOX_OPENSANDBOX_USE_SERVER_PROXY: ${{ vars.SANDBOX_OPENSANDBOX_USE_SERVER_PROXY }}
      OPEN_SANDBOX_API_KEY: ${{ secrets.OPEN_SANDBOX_API_KEY }}
      SANDBOX_OPENSANDBOX_EVIDENCE_TOKEN: ${{ secrets.SANDBOX_OPENSANDBOX_EVIDENCE_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Require real multi-tenant browser and media isolation evidence
        run: bun run verify:034:isolation:live

  selfhost-airgap-proof:
    name: Full self-host air-gap proof
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Prove the inherited release-image air-gap boundary
        run: bun run verify:034:selfhost-airgap
