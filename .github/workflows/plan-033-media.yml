name: Plan 033 advanced ingestion and media

on:
  pull_request:
    paths:
      - "apps/server/src/ingestion/**"
      - "apps/server/src/sandbox/**"
      - "apps/server/scripts/sandbox-conformance*"
      - "apps/server/package.json"
      - "apps/server/src/jobs/ingest-link.ts"
      - "apps/server/src/jobs/build-document-latex.ts"
      - "apps/server/src/jobs/material-preview.ts"
      - "apps/server/src/jobs/transcribe-material-media.ts"
      - "apps/sandbox-worker/**"
      - "apps/server/src/db/schema/advanced-media.ts"
      - "apps/server/drizzle/0059_*"
      - "packages/agent-contracts/src/media*"
      - "packages/agent-contracts/src/sandbox*"
      - "packages/agent-contracts/src/index.ts"
      - "packages/agent-contracts/package.json"
      - "apps/web/src/components/materials/**"
      - "scripts/verification/plan-033*"
      - ".github/workflows/plan-033-media.yml"
      - "package.json"
      - "bun.lock"
  push:
    branches: [main]
    paths:
      - "apps/server/src/ingestion/**"
      - "apps/server/src/sandbox/**"
      - "apps/server/scripts/sandbox-conformance*"
      - "apps/server/package.json"
      - "apps/server/src/jobs/ingest-link.ts"
      - "apps/server/src/jobs/build-document-latex.ts"
      - "apps/server/src/jobs/material-preview.ts"
      - "apps/server/src/jobs/transcribe-material-media.ts"
      - "apps/sandbox-worker/**"
      - "apps/server/src/db/schema/advanced-media.ts"
      - "apps/server/drizzle/0059_*"
      - "packages/agent-contracts/src/media*"
      - "packages/agent-contracts/src/sandbox*"
      - "packages/agent-contracts/src/index.ts"
      - "packages/agent-contracts/package.json"
      - "apps/web/src/components/materials/**"
      - "scripts/verification/plan-033*"
      - ".github/workflows/plan-033-media.yml"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plan-033-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  DATABASE_URL: file:./plan-033-ci.db
  BETTER_AUTH_URL: http://localhost:5000
  BETTER_AUTH_SECRET: plan-033-ci-secret-longer-than-thirty-two-characters
  CLIENT_URL: http://localhost:3000
  DISABLE_EMAIL: "true"
  DISABLE_UPLOADS: "true"
  DISABLE_JOBS: "true"

jobs:
  repository-verification:
    name: Contracts, ingestion fixtures, artifacts and sandbox policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Install the lockfile-matched Chromium runtime
        run: bun node_modules/playwright-core/cli.js install --with-deps chromium

      - name: Verify advanced-media repository gates
        run: |
          bun run verify:033:contracts
          bun run verify:033:ingestion
          bun run verify:033:artifacts
          bun run verify:033:sandbox:repository

  live-sandbox-proof:
    name: Live attested browser and media profiles (push/manual)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SANDBOX_PROVIDER: ${{ vars.SANDBOX_PROVIDER }}
      SANDBOX_HOST_POLICY_DIGEST: ${{ vars.SANDBOX_HOST_POLICY_DIGEST }}
      SANDBOX_EVIDENCE_MAX_AGE_MS: "300000"
      SANDBOX_PROFILE_BROWSER_ENABLED: "true"
      SANDBOX_PROFILE_BROWSER_VERSION: ${{ vars.SANDBOX_PROFILE_BROWSER_VERSION }}
      SANDBOX_PROFILE_BROWSER_IMAGE_DIGEST: ${{ vars.SANDBOX_PROFILE_BROWSER_IMAGE_DIGEST }}
      SANDBOX_PROFILE_BROWSER_IMAGE_URI: ${{ vars.SANDBOX_PROFILE_BROWSER_IMAGE_URI }}
      SANDBOX_PROFILE_MEDIA_ENABLED: "true"
      SANDBOX_PROFILE_MEDIA_VERSION: ${{ vars.SANDBOX_PROFILE_MEDIA_VERSION }}
      SANDBOX_PROFILE_MEDIA_IMAGE_DIGEST: ${{ vars.SANDBOX_PROFILE_MEDIA_IMAGE_DIGEST }}
      SANDBOX_PROFILE_MEDIA_IMAGE_URI: ${{ vars.SANDBOX_PROFILE_MEDIA_IMAGE_URI }}
      SANDBOX_OPENSANDBOX_DOMAIN: ${{ vars.SANDBOX_OPENSANDBOX_DOMAIN }}
      SANDBOX_OPENSANDBOX_EVIDENCE_URL: ${{ vars.SANDBOX_OPENSANDBOX_EVIDENCE_URL }}
      SANDBOX_OPENSANDBOX_PROTOCOL: ${{ vars.SANDBOX_OPENSANDBOX_PROTOCOL }}
      SANDBOX_OPENSANDBOX_ISOLATION: ${{ vars.SANDBOX_OPENSANDBOX_ISOLATION }}
      SANDBOX_TRUSTED_DEVELOPMENT: ${{ vars.SANDBOX_TRUSTED_DEVELOPMENT }}
      SANDBOX_MULTI_TENANT: ${{ vars.SANDBOX_MULTI_TENANT }}
      SANDBOX_OPENSANDBOX_USE_SERVER_PROXY: ${{ vars.SANDBOX_OPENSANDBOX_USE_SERVER_PROXY }}
      OPEN_SANDBOX_API_KEY: ${{ secrets.OPEN_SANDBOX_API_KEY }}
      SANDBOX_OPENSANDBOX_EVIDENCE_TOKEN: ${{ secrets.SANDBOX_OPENSANDBOX_EVIDENCE_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Require fresh live evidence for every Plan 033 profile
        run: bun run verify:033:sandbox:live
